<!DOCTYPE html>
<html lang="en">
<head>
    <title>My First Webpage</title>
    <style>
        body
        {
            text-align: center;
        }
        button
        {
            background-color: blue;
            color: white;
        }
    </style>

</head>
<body>          
    <h1>Email Spam Classifier</h1>
    <form method="post" action="/predict">
        <textarea name="content" placeholder="Enter Your Email Body" rows="12" cols="60" autocomplete="off">
            {{ email }}
        </textarea>
        <div>
            <button>Button</button> 
            <a href="/">Reset</a>
        </div>       
    </form>

    {% if prediction == 1 %}
        <h2 style="color: red;">Spam</h2>
    {% elif prediction == -1 %}
        <h2 style="color: green;">Not Spam</h2>
    {% endif %}

</body>
</html>
